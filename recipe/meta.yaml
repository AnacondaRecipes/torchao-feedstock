{% set name = "torchao" %}
{% set version = "0.18.0" %}
# Upstream repository name (pytorch/ao) differs from the conda package name.
{% set upstream_name = "ao" %}
# pytorch/libtorch minor to build against. Set here because the aggregate CBC
# `pytorch` pin still lags; switch to the CBC variable once it catches up.
{% set torch_version = "2.15" %}
# CUTLASS (header-only) from pkgs/main; upstream's third_party/cutlass submodule is v4.1.0.
{% set cutlass_version = "4.8.0" %}
# Apache-2.0 text for code adapted from NVIDIA TransformerEngine (mx_kernels, compiled into
# _C_mxfp8), QuaRot (prototype/spinquant) and HF transformers (prototype/paretoq).
{% set te_version = "2.20.2" %}
# CUDA variants carry +100 so they sort above the CPU build of the same version.
# Selector-gated sets, not duplicate number/string keys or Jinja if-blocks: anaconda-linter
# warns on duplicate keys and cannot parse if-blocks.
{% set build_number = 2 %}
{% set build_number = build_number + 100 %}  # [gpu_variant == "cuda"]
{% set variant_tag = "cpu" %}
{% set variant_tag = "cuda129" %}  # [gpu_variant == "cuda" and cuda_compiler_version == "12.9"]
{% set variant_tag = "cuda130" %}  # [gpu_variant == "cuda" and cuda_compiler_version == "13.0"]

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/pytorch/{{ upstream_name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 7b91e1a96cecb891e11f925ebaf93fd6b6b7dab52594f3b683338f8ecedbebf4
  # CUTLASS headers come from the conda `cutlass` host dep; fetch only its license,
  # which must ship because the headers are compiled into the CUDA extensions.
  - url: https://raw.githubusercontent.com/NVIDIA/cutlass/v{{ cutlass_version }}/LICENSE.txt
    sha256: ad1513ca983da737a6843364ad19e8424a56d860736c2da773b8c5be527e1475
    fn: cutlass-LICENSE.txt
    folder: third_party/cutlass
  - url: https://raw.githubusercontent.com/NVIDIA/TransformerEngine/v{{ te_version }}/LICENSE
    sha256: bea1b4266f1499fa4bbb16d6e7577e6b5b53d1ef010835a9d460876022cc8722
    fn: Apache-2.0-LICENSE.txt
    folder: third_party/licenses
  # MIT text for prototype/common/triton/matmul_perf_model.py (copied from triton-lang/kernels)
  # and prototype/awq/example.py (adapted from mit-han-lab/llm-awq). Pinned to the commit that
  # added the triton-lang/kernels license (the repo has no tags).
  - url: https://raw.githubusercontent.com/triton-lang/kernels/ddb6edadd63cd1b796e65f4f98a969b96f4f4f7d/LICENSE
    sha256: d56b269564c3b0ab9218cdc6325fc6c8de256a810aabaa249be592fc1c4bbf1c
    fn: MIT-LICENSE.txt
    folder: third_party/licenses

build:
  number: {{ build_number }}
  # CUDA variant: linux only (pytorch ships CUDA builds for linux-64 and linux-aarch64).
  # CPU variant: linux-64, linux-aarch64, osx-arm64, win-64, win-arm64.
  # Python 3.11 minimum: pytorch 2.15 requires python >=3.11 (no py3.10 builds on
  # pkgs/main); torchao itself is py_limited_api cp310.
  skip: true  # [py<311 or (gpu_variant == "cuda" and not linux)]
  # py{{ CONDA_PY }} MUST be in the build string: the package is python-version-specific
  # (.pyc bytecode tagged cpXY) but a manual `string:` overrides conda-build's default
  # py-prefix. Without it all 5 Python builds collapse to one filename per variant and
  # collide on upload — only py3.14 survived in build 1 (PKG-14920).
  string: {{ variant_tag }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  script_env:
    - gpu_variant={{ gpu_variant }}
    - cuda_compiler_version={{ cuda_compiler_version }}   # [gpu_variant == "cuda"]
    # Suppress the +git<sha> version suffix — setup.py appends it when
    # VERSION_SUFFIX is unset and the source tree is not a git repo.
    - VERSION_SUFFIX=
  # CUDA *-dev packages carry run_exports that would pin cuda-cudart/libcublas/etc.
  # into torchao's run deps. pytorch's own run deps already cover the runtime
  # CUDA libraries, so we suppress the duplicates here (same pattern as xformers).
  ignore_run_exports_from:                         # [gpu_variant == "cuda"]
    - cuda-nvrtc-dev                               # [gpu_variant == "cuda"]
    - cuda-nvtx-dev                                # [gpu_variant == "cuda"]
    - libcublas-dev                                # [gpu_variant == "cuda"]
    - libcufft-dev                                 # [gpu_variant == "cuda"]
    - libcurand-dev                                # [gpu_variant == "cuda"]
    - libcusolver-dev                              # [gpu_variant == "cuda"]
    - libcusparse-dev                              # [gpu_variant == "cuda"]

requirements:
  # CPU builds are pure Python (USE_CPP=0), so compilers are CUDA-only; this keeps
  # their compiler/stdlib run_exports (libgcc, libstdcxx, __glibc, vc14_runtime) out.
  build:
    - {{ compiler('cxx') }}                        # [gpu_variant == "cuda"]
    - {{ stdlib('c') }}                            # [gpu_variant == "cuda"]
    - {{ compiler('cuda') }}                       # [gpu_variant == "cuda"]
    # torch.utils.cpp_extension uses ninja when it is on PATH (parallel nvcc).
    - ninja-base                                   # [gpu_variant == "cuda"]

  host:
    - python
    - pip
    - setuptools
    - wheel
    # setup.py imports torch at top level; pin the flavor we compile against (ABI).
    # cpu_mkl is x86_64-only, so osx-arm64, linux-aarch64 and win-arm64 use cpu_openblas.
    - pytorch {{ torch_version }}.* cpu_openblas*    # [gpu_variant != "cuda" and not ((linux or win) and x86_64)]
    - pytorch {{ torch_version }}.* cpu_mkl*         # [gpu_variant != "cuda" and ((linux or win) and x86_64)]
    - pytorch {{ torch_version }}.* gpu_cuda129*     # [gpu_variant == "cuda" and cuda_compiler_version == "12.9"]
    - pytorch {{ torch_version }}.* gpu_cuda130*     # [gpu_variant == "cuda" and cuda_compiler_version == "13.0"]
    - libtorch {{ torch_version }}.* cpu_openblas*   # [gpu_variant != "cuda" and not ((linux or win) and x86_64)]
    - libtorch {{ torch_version }}.* cpu_mkl*        # [gpu_variant != "cuda" and ((linux or win) and x86_64)]
    - libtorch {{ torch_version }}.* gpu_cuda129*    # [gpu_variant == "cuda" and cuda_compiler_version == "12.9"]
    - libtorch {{ torch_version }}.* gpu_cuda130*    # [gpu_variant == "cuda" and cuda_compiler_version == "13.0"]
    # CUDA development headers (linking only; runtime libraries come via pytorch run_exports).
    # cuda-version pins all CUDA packages (incl. cuda-cccl) to the exact compiler sub-version;
    # without it cuda-cccl can resolve to a different 13.x sub-version than nvcc, breaking builds.
    - cuda-version {{ cuda_compiler_version }}     # [gpu_variant == "cuda"]
    - cuda-cudart-dev                              # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - cuda-nvrtc-dev                               # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - cuda-nvtx-dev                                # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - cuda-nvml-dev                                # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - libcublas-dev                                # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - libcufft-dev                                 # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - libcurand-dev                                # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - libcusolver-dev                              # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    - libcusparse-dev                              # [gpu_variant == "cuda"] analint: host_section_needs_exact_pinnings  # floats with cuda-version
    # Header-only; no run_exports.
    - cutlass {{ cutlass_version }}                # [gpu_variant == "cuda"]

  run:
    - python
    # Pin >= the pytorch we build against to enforce the compiled ABI.
    - pytorch >={{ torch_version }}.0=cpu_openblas*  # [gpu_variant != "cuda" and not ((linux or win) and x86_64)]
    - pytorch >={{ torch_version }}.0=cpu_mkl*       # [gpu_variant != "cuda" and ((linux or win) and x86_64)]
    - pytorch >={{ torch_version }}.0=gpu_cuda129*   # [gpu_variant == "cuda" and cuda_compiler_version == "12.9"]
    - pytorch >={{ torch_version }}.0=gpu_cuda130*   # [gpu_variant == "cuda" and cuda_compiler_version == "13.0"]
    - __cuda                                         # [gpu_variant == "cuda"]

  run_constrained:
    # Optional CoreML codebook quantization (prototype): upstream raises ImportError
    # below coremltools 8.3.0 (torchao/prototype/quantization/codebook_coreml/api.py).
    - coremltools >=8.3.0

test:
  requires:
    - pip
  imports:
    - torchao
    - torchao.quantization
  commands:
    - pip check
    # Release version, no "+git" suffix (setup.py appends one if VERSION_SUFFIX is unset).
    - python -c "import torchao; assert torchao.__version__ == '{{ version }}', torchao.__version__"
    # Upstream's top-level `test` suite must not be installed into site-packages.
    - python -c "import pathlib, sysconfig; t = pathlib.Path(sysconfig.get_paths()['purelib'], 'test'); assert not t.exists(), t"
    # torchao only warns when a compiled extension fails to load; fail the test instead.
    - python -c "import pathlib, torch, torchao; so = list(pathlib.Path(torchao.__file__).parent.glob('_C*.so')); assert so, 'no _C extension'; [torch.ops.load_library(str(f)) for f in so]"  # [gpu_variant == "cuda"]

about:
  home: https://github.com/pytorch/ao
  summary: PyTorch-native quantization and optimization library for training and inference
  description: |
    TorchAO is an easy-to-use quantization and optimization library built on native
    PyTorch. It provides quantization (INT8, INT4, FP8), sparsity, and low-bit
    optimizer support, and works out-of-the-box with torch.compile() and FSDP2.
    TorchAO is the official PyTorch quantization backend for vLLM, HuggingFace
    Transformers, and TorchTune.
  license: BSD-3-Clause AND Apache-2.0 AND MIT
  license_family: Other
  license_file:
    - LICENSE
    - third_party/cutlass/cutlass-LICENSE.txt  # [gpu_variant == "cuda"]
    - third_party/licenses/Apache-2.0-LICENSE.txt
    - third_party/licenses/MIT-LICENSE.txt
  doc_url: https://docs.pytorch.org/ao/stable/index.html
  dev_url: https://github.com/pytorch/ao

extra:
  recipe-maintainers:
    - shermansiu
    - isuruf
    - xhochy
    - xkong-anaconda
