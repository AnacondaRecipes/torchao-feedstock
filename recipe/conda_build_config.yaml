# Use cuda_compiler_version alone (no gpu_variant, no zip_keys).
# With selectors on each value, non-linux-x86_64 platforms get only [none],
# linux-64 gets [none, 12.9] — no cross-product, no zip_keys needed.
# pytorch 2.14.0 on pkgs/main ships gpu_cuda129_* for linux-64 (CUDA 13.0 was
# dropped in the 2.14 line — no gpu_cuda130_* build); torchao must link against
# the same CUDA runtime, so only the 12.9 variant is built.
cuda_compiler_version:
  - none
  - 12.9   # [linux and x86_64]
