# gpu_variant zipped with cuda_compiler_version (xformers pattern), matching pytorch's
# CUDA builds on pkgs/main: linux-64 [none, 12.9, 13.0], linux-aarch64 [none, 13.0].
# `none` is UN-gated: the aggregate sets cuda_compiler_version for linux and win, and
# per-key replacement means this list must cover every platform.
gpu_variant:
  - none
  - cuda                       # [linux and x86_64]
  - cuda                       # [linux]

cuda_compiler_version:
  - none
  - 12.9                       # [linux and x86_64]
  - 13.0                       # [linux]

zip_keys:                      # [linux]
  -                            # [linux]
    - gpu_variant              # [linux]
    - cuda_compiler_version    # [linux]
